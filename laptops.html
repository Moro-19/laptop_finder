<!DOCTYPE html>
<head>
  <title>Laptops - Student Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body data-theme="battery-saver" class="min-h-screen transition-colors duration-300">

  <header class="flex justify-between items-center p-4 shadow-md">
    <h1 class="font-bold text-xl"> Student Laptop Finder</h1>
    <button id="nav-toggle" class="sm:hidden text-2xl">☰</button>
    <nav id="main-nav" class="hidden sm:flex gap-4 items-center">
      <a href="index.html">Home</a>
      <a href="laptops.html" class="font-semibold">Laptops</a>
      <a href="favorites.html">Favorites</a>
      <a href="compare.html">Compare</a>
      <button id="theme-toggle" class="btn-action">Switch Theme</button>
    </nav>
  </header>

  <nav id="mobile-nav" class="hidden flex-col gap-2 p-4 sm:hidden">
    <a href="index.html">Home</a>
    <a href="laptops.html" class="font-semibold">Laptops</a>
    <a href="favorites.html">Favorites</a>
    <a href="compare.html">Compare</a>
    <button id="theme-toggle-mobile" class="btn-action w-fit">Switch Theme</button>
  </nav>

  <main class="p-6 max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Browse Laptops</h2>

    <section class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center mb-4">
      <input
        type="text"
        id="search-input"
        placeholder="Search by name or brand..."
        class="border rounded-md p-2 flex-1 min-w-[200px]"/>

      <select id="category-filter" class="border rounded-md p-2">
        <option value="">All Categories</option>
        <option value="ultrabook">Ultrabook</option>
        <option value="gaming">Gaming</option>
        <option value="2-in-1">2-in-1</option>
        <option value="creator">Creator</option>
        <option value="budget">Budget</option>
      </select>

      <input
        type="number"
        id="max-price-filter"
        placeholder="Max price"
        class="border rounded-md p-2 w-28"/>

      <input
        type="number"
        id="min-ram-filter"
        placeholder="Min RAM (GB)"
        class="border rounded-md p-2 w-32"/>

      <select id="sort-select" class="border rounded-md p-2">
        <option value="">Sort by...</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="battery-asc">Battery: Low to High</option>
        <option value="battery-desc">Battery: High to Low</option>
        <option value="weight-asc">Weight: Low to High</option>
        <option value="weight-desc">Weight: High to Low</option>
      </select>
    </section>

    <p id="result-count" class="text-sm mb-4"></p>

    <section id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>

    <p id="no-results" class="hidden text-center text-lg mt-10">No laptops match your filters.</p>
    <p id="error-message" class="hidden text-center text-lg mt-10 text-red-600"></p>
  </main>

  <script type="module" src="src/js/laptops.js"></script>
</body>
</html>
